# Config for the Railway CRON services (not the web app — that's railway.toml).
# Point a cron service at this file in Railway: Settings → Config-as-code →
# "railway.cron.toml".
#
# Each Railway service carries ONE schedule, so there is a service per cadence:
#   reminders  →  node scripts/run-cron.mjs reminders
#   daily      →  node scripts/run-cron.mjs cleanup-exports data-retention hibernate-resume
# Set each service's Custom Start Command accordingly; schedules are UTC and
# must be at least 5 minutes apart.
#
# Required variables on each cron service: CRON_SECRET (same value as the web
# service) and CRON_BASE_URL (the PUBLIC origin — the proxy 404s hosts it can't
# resolve to an org, so *.railway.internal will not work).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.cron"

[deploy]
# A cron service runs to completion and exits. No health check (it serves no
# HTTP), and no restarts — a failed run is reported, then retried on schedule.
restartPolicyType = "NEVER"
